org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Folder holding the OCR models (the same ones the desktop app uses).
# Override on the command line: gradlew assembleRelease -PocrModelsDir=D:/models
ocrModelsDir=../Desktop-ver/models
# Detector tiers bundled into the APK (comma separated: medium,small,tiny).
# Dropping medium makes the APK about 120 MB smaller.
ocrTiers=medium,small,tiny
